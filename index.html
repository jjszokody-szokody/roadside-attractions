<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roadside Gems</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"><link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<link rel="preconnect" href="https://fonts.gstatic.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--accent:#e4572e;--bg:#f6f7f9;--card:#fff;--text:#1f2328;--muted:#6b7280;--line:#e5e7eb;--quirk:#7c3aed;--r:14px;--sh:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.06)}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
header{background:var(--accent);color:#fff;padding:14px 20px;text-align:center}header h1{margin:0;font-size:1.25rem;font-weight:700;letter-spacing:-.01em}
nav{display:flex;gap:4px;margin:14px 16px 0;padding:4px;background:#eceef1;border-radius:12px}nav button{flex:1;padding:9px;border:0;border-radius:9px;background:transparent;color:var(--muted);font:600 .95rem inherit;cursor:pointer;transition:.15s}nav button.on{background:#fff;color:var(--text);box-shadow:var(--sh)}
.filt{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px 0;color:var(--muted);font-size:.85rem}.fb{padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--text);font:500 .85rem inherit;cursor:pointer;transition:.15s}.fb.on{background:var(--text);border-color:var(--text);color:#fff}
section{display:none;flex:1;overflow:auto;min-height:0}section.on{display:flex;flex-direction:column}
.bar{display:flex;gap:8px;padding:12px 16px}.bar input{flex:1;min-width:0;padding:11px 14px;border:1px solid var(--line);border-radius:12px;font:inherit;background:#fff;outline:none}.bar input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(228,87,46,.15)}
.bar button{padding:0 16px;background:var(--accent);color:#fff;border:0;border-radius:12px;font:600 .9rem inherit;cursor:pointer}.bar button[title]{background:#fff;border:1px solid var(--line)}
#status,#mstatus{padding:0 18px 6px;color:var(--muted);font-size:.85rem}
ul{list-style:none;margin:0;padding:6px 16px 24px;display:flex;flex-direction:column;gap:10px}li{background:var(--card);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh);line-height:1.5}
li b{font-size:1rem;font-weight:600}.tag{display:inline-block;background:#f1f2f4;color:var(--muted);border-radius:999px;padding:2px 10px;font-size:.75rem;font-weight:500;margin:4px 0}
.dist{float:right;font-weight:600;color:var(--accent);font-size:.9rem}a{color:var(--accent);text-decoration:none;font-weight:500;font-size:.9rem}
.qb{display:inline-block;background:#f3e8ff;color:var(--quirk);border-radius:999px;padding:1px 9px;font-size:.72rem;font-weight:600;margin-left:6px;vertical-align:middle}li.q{border-left:4px solid var(--quirk)}.src{color:var(--muted);font-size:.75rem}
.pin{width:28px;height:28px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:12px;box-shadow:0 2px 6px rgba(0,0,0,.3)}.pin>*{transform:rotate(45deg)}.pq{background:var(--quirk)}.pr{background:var(--accent);color:#fff}
#sheet{position:fixed;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;max-height:78vh;overflow:auto;background:#fff;border-radius:20px 20px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.18);transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);z-index:2000;padding:10px 20px 28px}#sheet.open{transform:none}
#sheet:before{content:'';display:block;width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
#sheet h2{margin:6px 44px 6px 0;font-size:1.3rem;font-weight:700;letter-spacing:-.01em}#sheet h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:20px 0 10px}
#sheet .x{position:sticky;top:0;float:right;width:32px;height:32px;border:0;border-radius:50%;background:#f1f2f4;color:var(--text);font-size:1rem;cursor:pointer}
#sheet img{width:100%;max-height:220px;object-fit:cover;border-radius:12px;display:block;margin:12px 0}#sheet p{line-height:1.55;color:#374151}.row{margin:8px 0;font-size:.92rem}.links{display:grid;grid-template-columns:1fr 1fr;gap:8px}.links a{background:#f6f7f9;border-radius:10px;padding:10px;text-align:center;color:var(--text);font-size:.85rem}.links a:hover{background:#eceef1}
footer{padding:8px 16px;text-align:center;font-size:.7rem;color:var(--muted);background:var(--bg)}footer a{font-size:.7rem}
#map{flex:1;min-height:300px;margin:0 16px 12px;border-radius:var(--r);box-shadow:var(--sh)}
</style></head><body>
<header><h1>Roadside Gems</h1></header>
<nav><button id="tN" class="on" onclick="tab('N')">Nearby</button><button id="tM" onclick="tab('M')">Map</button></nav>
<div class="filt"><button class="fb on" data-f="all" onclick="setFilter('all')">All</button><button class="fb" data-f="q" onclick="setFilter('q')">🤪 Quirky only</button></div>
<section id="N" class="on">
 <div class="bar"><input id="place" placeholder="Or enter a town / address"><button onclick="nearPlace()">Go</button><button onclick="locate()" title="Use my location">📍</button></div>
 <div id="status"></div><ul id="list"></ul></section>
<section id="M"><div class="bar"><input id="q" placeholder="Search anywhere…" onkeydown="if(event.key=='Enter')mapSearch()"><button onclick="mapSearch()">Search</button></div>
 <div id="mstatus"></div><div id="map"></div></section>
<footer>Data © <a target="_blank" href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a> (ODbL) · <a target="_blank" href="https://www.wikidata.org">Wikidata</a> (CC0) · <a target="_blank" href="https://www.wikipedia.org">Wikipedia</a> (CC BY-SA)</footer>
<div id="sheet" role="dialog" aria-label="Attraction details"><button class="x" onclick="closeSheet()" aria-label="Close">✕</button><div id="sheetBody"></div></div>
<script>
const R=32187,EPS=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter','https://overpass.private.coffee/api/interpreter'];
let map,layer;
function tab(t){for(const x of['N','M']){document.getElementById(x).classList.toggle('on',x==t);document.getElementById('t'+x).classList.toggle('on',x==t)}
 if(t=='M'){if(!map){map=L.map('map').setView([39.8,-98.6],4);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);layer=L.layerGroup().addTo(map)}setTimeout(()=>{map.invalidateSize();mapAutoLoad()},50)}}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function miles(a,b,c,d){const r=x=>x*Math.PI/180,dl=r(c-a),dn=r(d-b),h=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dn/2)**2;return 3958.8*2*Math.asin(Math.sqrt(h))}
const QUIRK=/giant|largest|biggest|world'?s|\bbig\b|mystery|spot|wonder|oddit|museum of|dinosaur|muffler|mural|statue|twine|ball of|teapot|cowboy|bigfoot|ufo|alien|castle|carhenge|tipi|teepee|novelty|folk art|bottle|roadside/i;
function typeOf(t){if(t.artwork_type)return 'Art: '+t.artwork_type.replace(/_/g,' ');const v=t.attraction||t.tourism||t.historic||t.man_made||t.leisure||t.amenity||t.building||'';return({attraction:'Attraction',artwork:'Roadside Art',viewpoint:'Scenic Viewpoint',museum:'Museum',monument:'Monument',memorial:'Memorial',theme_park:'Theme Park',zoo:'Zoo',aquarium:'Aquarium',castle:'Castle',ruins:'Ruins',lighthouse:'Lighthouse',windmill:'Windmill',water_tower:'Water Tower',miniature_golf:'Mini Golf',fort:'Fort',ship:'Historic Ship',locomotive:'Old Locomotive',aircraft:'Old Aircraft'})[v]||v.replace(/_/g,' ')}
function isQuirky(t,name){return !!(t.artwork_type&&/statue|sculpture|mural|installation/.test(t.artwork_type))||t.attraction=='animal'||!!t.attraction||t.building&&QUIRK.test(name||'')||QUIRK.test(name||'')||!!t['roadside']}
async function overpass(lat,lon){
 const a=`(around:${R},${lat},${lon})`,rx=`"name"~"Giant|Largest|Biggest|World's|Big |Mystery|Spot|Wonder|Oddit|Museum of|Dinosaur|Muffler|Mural|Statue|Twine",i`;
 const q=`[out:json][timeout:40];(nwr["tourism"~"^(attraction|artwork|viewpoint|museum|theme_park|zoo|aquarium)$"]${a};nwr["historic"]["name"]${a};nwr["attraction"]${a};nwr["artwork_type"]${a};nwr["man_made"]["name"]["man_made"!~"^(pipeline|tower|mast|storage_tank|silo|works|wastewater_plant|water_works|reservoir_covered|pier|bridge|survey_point|chimney|petroleum_well|water_well)$"]${a};nwr["building"][${rx}]${a};nwr["amenity"][${rx}]${a};nwr["tourism"][${rx}]${a};nwr["historic"][${rx}]${a};nwr["man_made"][${rx}]${a};nwr["leisure"="miniature_golf"]${a};);out center tags 600;`;
 let err;for(const ep of EPS){try{const r=await fetch(ep,{method:'POST',body:'data='+encodeURIComponent(q),headers:{'Content-Type':'application/x-www-form-urlencoded'}});if(!r.ok)throw Error('HTTP '+r.status);const j=await r.json();
  return j.elements.map(e=>{const t=e.tags||{},n=t.name||t.description;return{name:n,type:typeOf(t),lat:e.lat??e.center?.lat,lon:e.lon??e.center?.lon,quirky:isQuirky(t,n),src:'OSM',tags:t,osm:e.type+'/'+e.id,web:t.website||t['contact:website'],wp:t.wikipedia&&t.wikipedia.startsWith('en:')?t.wikipedia.slice(3):null,qid:t.wikidata}}).filter(x=>x.name&&x.lat)}catch(e){err=e}}
 throw err}
const WD_TYPES='wd:Q14915208,wd:Q548879,wd:Q860861,wd:Q179700,wd:Q33506,wd:Q570116,wd:Q4989906,wd:Q5003624,wd:Q2319498,wd:Q1153484,wd:Q838948,wd:Q219423,wd:Q1007870',WD_QUIRK=['Q14915208','Q548879','Q860861','Q179700','Q1153484','Q219423'];
async function wikidata(lat,lon){
 const q=`SELECT ?i ?iLabel ?c ?ty ?tyLabel ?art ?desc WHERE { SERVICE wikibase:around { ?i wdt:P625 ?c. bd:serviceParam wikibase:center "Point(${lon} ${lat})"^^geo:wktLiteral. bd:serviceParam wikibase:radius "32". } ?i wdt:P31 ?ty. ?i rdfs:label ?l. FILTER(LANG(?l)='en') OPTIONAL{?ty wdt:P279 ?sup} OPTIONAL{?art schema:about ?i; schema:isPartOf <https://en.wikipedia.org/>} OPTIONAL{?i schema:description ?desc FILTER(LANG(?desc)='en')} FILTER(?ty IN (${WD_TYPES}) || ?sup IN (wd:Q14915208,wd:Q548879,wd:Q860861,wd:Q179700,wd:Q33506,wd:Q570116) || REGEX(?l,"Giant|Largest|Biggest|World's|Mystery|Dinosaur|Muffler|Wonder|Twine|Big ","i")) SERVICE wikibase:label { bd:serviceParam wikibase:language "en". } } LIMIT 300`;
 const r=await fetch('https://query.wikidata.org/sparql?format=json&query='+encodeURIComponent(q),{headers:{Accept:'application/sparql-results+json'}});if(!r.ok)throw Error('Wikidata HTTP '+r.status);const j=await r.json(),seen={};
 return j.results.bindings.map(b=>{const m=b.c.value.match(/Point\(([-\d.e]+) ([-\d.e]+)\)/),n=b.iLabel.value,qid=b.ty.value.split('/').pop();return{name:n,type:b.tyLabel.value,lat:+m[2],lon:+m[1],quirky:WD_QUIRK.includes(qid)||QUIRK.test(n),src:'Wikidata',qid:b.i.value.split('/').pop(),desc:b.desc?.value,wp:b.art?decodeURIComponent(b.art.value.split('/wiki/')[1]).replace(/_/g,' '):null}}).filter(x=>!/stream|river|creek|lake|mountain|cemetery/i.test(x.type)&&!/^Q\d+$/.test(x.name)&&!seen[x.name]&&(seen[x.name]=1))}
async function wikipedia(lat,lon){const r=await fetch(`https://en.wikipedia.org/w/api.php?action=query&list=geosearch&gscoord=${lat}|${lon}&gsradius=10000&gslimit=100&format=json&origin=*`);const j=await r.json();
 return (j.query?.geosearch||[]).filter(g=>QUIRK.test(g.title)).map(g=>({name:g.title,type:'Wikipedia landmark',lat:g.lat,lon:g.lon,quirky:true,src:'Wikipedia',wp:g.title}))}
const norm=s=>s.toLowerCase().replace(/[^a-z0-9]/g,'');
async function attractions(lat,lon){
 const res=await Promise.allSettled([overpass(lat,lon),wikidata(lat,lon),wikipedia(lat,lon)]),out=[],fails=[];
 res.forEach((r,i)=>{if(r.status=='fulfilled')out.push(...r.value);else fails.push(['OpenStreetMap','Wikidata','Wikipedia'][i])});
 if(fails.length==3)throw Error('all data sources unreachable');
 const merged=[];for(const x of out){x.d=miles(lat,lon,x.lat,x.lon);if(x.d>20)continue;const n=norm(x.name);
  const dup=merged.find(y=>miles(y.lat,y.lon,x.lat,x.lon)<0.3&&(norm(y.name)==n||norm(y.name).includes(n)||n.includes(norm(y.name))));
  if(dup){dup.quirky=dup.quirky||x.quirky;for(const k of['web','wp','qid','desc','tags','osm'])dup[k]=dup[k]||x[k];if(!dup.src.includes(x.src))dup.src+=' + '+x.src}else merged.push(x)}
 merged.sort((a,b)=>b.quirky-a.quirky||a.d-b.d);merged.sort((a,b)=>a.d-b.d);merged.fails=fails;return merged}
let FILTER='all',LAST=null,MLAST=null;
function setFilter(f){FILTER=f;document.querySelectorAll('.fb').forEach(b=>b.classList.toggle('on',b.dataset.f==f));if(LAST)renderList();if(MLAST)renderMap()}
const shown=xs=>FILTER=='q'?xs.filter(x=>x.quirky):xs,badge=x=>x.quirky?' <span class="qb">🤪 Quirky</span>':'';
async function geocode(q){const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q));const j=await r.json();if(!j.length)throw Error('Place not found');return{lat:+j[0].lat,lon:+j[0].lon,name:j[0].display_name}}
const dir=x=>`https://www.google.com/maps/dir/?api=1&destination=${x.lat},${x.lon}`;
async function loadList(lat,lon,label){const s=document.getElementById('status'),l=document.getElementById('list');s.textContent='🚗 Scouting the highway near '+label+'…';l.innerHTML='';
 try{LAST={xs:await attractions(lat,lon),label,lat,lon};renderList()}catch(e){s.textContent='Could not load attractions ('+e.message+'). Try again shortly.'}}
function renderList(){const {xs,label}=LAST,v=shown(xs),s=document.getElementById('status');s.textContent=v.length+(FILTER=='q'?' quirky':'')+' stops within 20 miles of '+label+(xs.fails.length?' (unavailable: '+xs.fails.join(', ')+')':'');
 LAST.v=v;document.getElementById('list').innerHTML=v.map((x,i)=>`<li${x.quirky?' class="q"':''}><span class="dist">${x.d.toFixed(1)} mi</span><b>${esc(x.name)}</b>${badge(x)}<br><span class="tag">${esc(x.type)}</span> <small class="src">${x.src}</small><br><a href="#" onclick="showOnMap(${i});return false">📍 Show on map</a> · <a href="#" onclick="openSheet(LAST.v[${i}]);return false">ℹ️ Details</a> · <a target="_blank" href="${dir(x)}">🧭 Directions</a></li>`).join('')||'<li>Nothing found here. Try another spot!</li>'}
function locate(){const s=document.getElementById('status');if(!navigator.geolocation){s.textContent='Geolocation unsupported. Enter a place above.';return}
 s.textContent='📍 Finding you…';navigator.geolocation.getCurrentPosition(p=>loadList(p.coords.latitude,p.coords.longitude,'you'),()=>{s.textContent='Location unavailable or denied. Enter a town or address above instead.'},{enableHighAccuracy:true,timeout:15000})}
async function nearPlace(){const v=document.getElementById('place').value.trim();if(!v)return;try{const g=await geocode(v);loadList(g.lat,g.lon,v)}catch(e){document.getElementById('status').textContent=e.message}}
document.getElementById('place').addEventListener('keydown',e=>{if(e.key=='Enter')nearPlace()});
async function mapSearch(){const v=document.getElementById('q').value.trim(),s=document.getElementById('mstatus');if(!v)return;s.textContent='Searching…';MAP_LOADED=true;
 try{const g=await geocode(v);await mapAt(g.lat,g.lon,v)}catch(e){mErr(e)}}
let mk=null,MARK=[];
const pin=q=>L.divIcon({className:'',html:`<div class="pin ${q?'pq':'pr'}">${q?'🤪':'★'}</div>`,iconSize:[30,30],iconAnchor:[15,30]});
function renderMap(){if(mk)layer.removeLayer(mk);mk=L.markerClusterGroup?L.markerClusterGroup({maxClusterRadius:45,showCoverageOnHover:false}):L.layerGroup();layer.addLayer(mk);const {xs,label}=MLAST,v=shown(xs);MARK=[];
 v.forEach(x=>{const m=L.marker([x.lat,x.lon],{icon:pin(x.quirky),title:x.name}).on('click',()=>openSheet(x));m.item=x;MARK.push(m);mk.addLayer(m)});
 document.getElementById('mstatus').textContent=v.length+(FILTER=='q'?' quirky':'')+' attractions within 20 mi of '+label+' · tap a pin for details'+(xs.fails.length?' (unavailable: '+xs.fails.join(', ')+')':'')}
async function mapAt(lat,lon,label,fit=true){layer.clearLayers();mk=null;L.circle([lat,lon],{radius:R,color:'#c8102e',fill:false,dashArray:'6'}).addTo(layer);
 L.circleMarker([lat,lon],{radius:8,color:'#fff',weight:3,fillColor:'#1b9aaa',fillOpacity:1}).addTo(layer).bindPopup(esc(label));if(fit)map.fitBounds(L.latLng(lat,lon).toBounds(R*2));
 document.getElementById('mstatus').textContent='Loading attractions…';MLAST={xs:await attractions(lat,lon),label,lat,lon};renderMap()}
let MAP_LOADED=false;
function mapAutoLoad(){if(MAP_LOADED)return;MAP_LOADED=true;
 if(LAST&&LAST.lat!=null){mapAt(LAST.lat,LAST.lon,LAST.label).catch(e=>mErr(e));return}
 if(!navigator.geolocation){document.getElementById('mstatus').textContent='Search a place to see attractions.';return}
 document.getElementById('mstatus').textContent='📍 Finding you…';
 navigator.geolocation.getCurrentPosition(p=>mapAt(p.coords.latitude,p.coords.longitude,'your location').catch(mErr),()=>{document.getElementById('mstatus').textContent='Location unavailable — search a place above.'},{timeout:15000})}
const mErr=e=>document.getElementById('mstatus').textContent='Error: '+e.message;
async function showOnMap(i){const x=LAST.v[i];tab('M');MAP_LOADED=true;
 if(!MLAST||MLAST.xs!==LAST.xs){layer.clearLayers();MLAST={xs:LAST.xs,label:LAST.label,lat:LAST.lat,lon:LAST.lon};L.circle([LAST.lat,LAST.lon],{radius:R,color:'#c8102e',fill:false,dashArray:'6'}).addTo(layer);renderMap()}
 setTimeout(()=>{const m=MARK.find(m=>m.item===x);if(m&&mk.zoomToShowLayer)mk.zoomToShowLayer(m,()=>{});else map.flyTo([x.lat,x.lon],16);openSheet(x)},120)}
function addr(t){if(!t)return '';const a=[[t['addr:housenumber'],t['addr:street']].filter(Boolean).join(' '),t['addr:city']||t['addr:town']||t['addr:village'],t['addr:state'],t['addr:postcode']].filter(Boolean);return a.join(', ')}
function town(x){const t=x.tags||{};return t['addr:city']||t['addr:town']||t['addr:village']||''}
async function openSheet(x){const t=x.tags||{},sh=document.getElementById('sheet'),c=document.getElementById('sheetBody');const ad=addr(t),q=encodeURIComponent((x.name+' '+town(x)).trim());
 const row=(k,v)=>v?`<div class="row"><b>${k}</b> ${v}</div>`:'';
 const L1=[[x.wp&&'https://en.wikipedia.org/wiki/'+encodeURIComponent(x.wp.replace(/ /g,'_')),'📖 Wikipedia'],[x.qid&&'https://www.wikidata.org/wiki/'+x.qid,'🗃️ Wikidata'],[x.web,'🌐 Official website'],[x.osm&&'https://www.openstreetmap.org/'+x.osm,'🗺️ OpenStreetMap'],
  [dir(x),'🧭 Google Maps directions'],['https://www.google.com/search?q='+q,'🔎 Google search'],['https://www.atlasobscura.com/search?q='+encodeURIComponent(x.name),'🧿 Search Atlas Obscura'],['https://www.roadsideamerica.com/search?q='+encodeURIComponent(x.name),'🛣️ Search Roadside America']].filter(l=>l[0]);
 c.innerHTML=`<h2>${esc(x.name)}</h2><span class="tag">${esc(x.type)}</span>${badge(x)}<div class="row"><b>📏</b> ${x.d.toFixed(1)} mi away</div>${row('📫',esc(ad))}
  ${row('🕒',t.opening_hours&&esc(t.opening_hours))}${row('☎️',(t.phone||t['contact:phone'])&&`<a href="tel:${esc(t.phone||t['contact:phone'])}">${esc(t.phone||t['contact:phone'])}</a>`)}${row('🌐',x.web&&`<a target="_blank" href="${esc(x.web)}">${esc(x.web.replace(/^https?:\/\//,''))}</a>`)}
  ${t.description?`<p>${esc(t.description)}</p>`:''}${x.desc?`<p><i>${esc(x.desc)}</i></p>`:''}<div id="wpx"></div>
  <h3>More info</h3><div class="links">${L1.map(l=>`<a target="_blank" rel="noopener" href="${esc(l[0])}">${l[1]}</a>`).join('')}</div><small class="src">Source: ${x.src}</small>`;
 sh.classList.add('open');sh.scrollTop=0;
 if(x.wp){document.getElementById('wpx').innerHTML='<p class="src">Loading Wikipedia summary…</p>';try{const r=await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(x.wp.replace(/ /g,'_')));const j=await r.json();
  document.getElementById('wpx').innerHTML=(j.thumbnail?`<img src="${esc(j.thumbnail.source)}" alt="">`:'')+(j.extract?`<p>${esc(j.extract)}</p>`:'')}catch(e){document.getElementById('wpx').innerHTML=''}}}
function closeSheet(){document.getElementById('sheet').classList.remove('open')}
locate();
</script></body></html>
